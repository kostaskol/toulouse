# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  errors:
    messages:
      duplicate_combination: "repeat another variant's values for the selectable specifications"
      selection_incomplete: "leave an active variant with no value for a selectable specification"
      kind_taken: "use two specifications of one kind"
      single_value: "give more than one value to a single-value specification"
      required_by_kind: "must be on for a specification with a kind"
      off_when_selectable: "must be off for a specification with variant selection"
      any_when_single: "must be any for a single-value specification"
      multiple_values_held: "cannot be turned off while a product or variant holds more than one value"
      kind_in_use: "would give a product two specifications of this kind"
      selection_in_use: "would leave variants that repeat each other or lack a value"
      no_active_variant: "cannot be published without an active variant"
      weight_missing: "cannot be published while an active variant has no weight"
      last_active_variant: "cannot be archived on the last active variant of a published product"
      too_many_variants: "would exceed %{count} variants for the product"
      invalid_parent: "cannot be the category itself or one below it"
      insufficient_stock: "cannot go below zero unless the variant allows oversell"
      content_type: "must be a JPEG, PNG or WebP image"
      too_large: "must be at most %{count} MB"
      too_many_pixels: "must be at most %{count} megapixels"
      too_many_images: "would exceed %{count} images for the product"
      product_cell_conflict: "differs from the first row of this handle"
