# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable

# Describing a behaviour by name reads better than naming a class for specs that
# cover wiring rather than one object.
RSpec/DescribeClass:
  Enabled: false

# Two assertions about one behaviour beat two examples repeating the same setup.
RSpec/MultipleExpectations:
  Max: 3

RSpec/ExampleLength:
  Max: 10

Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: no_space
