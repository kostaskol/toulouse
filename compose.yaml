name: toulouse

services:
  api:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      RAILS_MAX_THREADS: 5
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_APP_USER: toulouse_app
      POSTGRES_APP_PASSWORD: toulouse_app
      POSTGRES_PLATFORM_USER: toulouse_platform
      POSTGRES_PLATFORM_PASSWORD: toulouse_platform
      REDIS_URL: redis://redis:6379/0
      # OrbStack gives every container a routable IP and a .orb.local name;
      # Rails host authorization rejects those names unless they are allowed.
      # Both forms are listed because Rails allows only one subdomain label
      # per pattern: .orb.local covers toulouse-api-1.orb.local, and
      # .toulouse.orb.local covers the compose-style api.toulouse.orb.local.
      RAILS_DEVELOPMENT_HOSTS: .orb.local,.toulouse.orb.local
    volumes:
      # Live reload: the working tree shadows the copy baked into the image.
      # Gems live in /usr/local/bundle and are not shadowed.
      - .:/rails
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toulouse

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toulouse_development
      POSTGRES_APP_USER: toulouse_app
      POSTGRES_APP_PASSWORD: toulouse_app
      POSTGRES_PLATFORM_USER: toulouse_platform
      POSTGRES_PLATFORM_PASSWORD: toulouse_platform
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images store data under a major-version subdirectory, so the
      # mount goes one level up. Mounting /data makes the container refuse to start.
      - postgres-data:/var/lib/postgresql
      - ./script/create_roles.sh:/docker-entrypoint-initdb.d/create_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toulouse_development"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - toulouse

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - toulouse

networks:
  toulouse:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
