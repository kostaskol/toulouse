  - name: Platform admin
    meta:
      id: fld_ba69d648aad6a21677cbe1c17db315fb
      created: 1791319630754
      modified: 1791319630754
      sortKey: 2
      description: >-
        Server-rendered. Sign-in form stores the CSRF token that Sign in and Sign
        out send, and API keys stores the one that Issue and Revoke send. Sign in
        asks for a code from `bin/rails platform:admins:code EMAIL=...`.
    children:
      - url: "{{ _.base_url }}/platform/session/new"
        name: Sign-in form
        meta:
          id: req_936592d139c5f522be48332474e5bd57
          created: 1791319630754
          modified: 1791319630754
          isPrivate: false
          sortKey: 0
        method: GET
        scripts:
          afterResponse: |-
            const token = insomnia.response.text().match(/name="authenticity_token" value="([^"]+)"/)?.[1];
            insomnia.environment.set("platform_authenticity_token", token ?? "");
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/platform/session"
        name: Sign in
        meta:
          id: req_d87ef4328e463452155317c20ac4902c
          created: 1791319630754
          modified: 1791319630754
          isPrivate: false
          sortKey: 1
        method: POST
        body:
          mimeType: application/x-www-form-urlencoded
          params:
            - name: authenticity_token
              value: "{{ _.platform_authenticity_token }}"
            - name: email
              value: "{{ _.platform_email }}"
            - name: password
              value: "{{ _.password }}"
            - name: code
              value: "{% prompt 'Authenticator code', 'From platform:admins:code', '', '', false, false %}"
        headers:
          - name: Content-Type
            value: application/x-www-form-urlencoded
        scripts:
          afterResponse: |-
            const token = insomnia.response.text().match(/name="authenticity_token" value="([^"]+)"/)?.[1];
            insomnia.environment.set("platform_authenticity_token", token ?? "");
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/platform/logout"
        name: Sign out
        meta:
          id: req_5af37acfa1c9c862cee875779cf967f2
          created: 1791319630754
          modified: 1791319630754
          isPrivate: false
          sortKey: 2
        method: POST
        body:
          mimeType: application/x-www-form-urlencoded
          params:
            - name: authenticity_token
              value: "{{ _.platform_authenticity_token }}"
        headers:
          - name: Content-Type
            value: application/x-www-form-urlencoded
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/platform/tenants"
        name: Tenants
        meta:
          id: req_bf7405923cd4d5b236958d0ad81c1ee2
          created: 1791374400000
          modified: 1791374400000
          isPrivate: false
          sortKey: 3
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/platform/tenants/{{ _.platform_tenant_id }}/api_keys"
        name: API keys
        meta:
          id: req_99b2c518e18b5376b84523d960a3ee81
          created: 1791374400000
          modified: 1791374400000
          isPrivate: false
          sortKey: 4
        method: GET
        scripts:
          afterResponse: |-
            const token = insomnia.response.text().match(/name="csrf-token" content="([^"]+)"/)?.[1];
            insomnia.environment.set("platform_authenticity_token", token ?? "");
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/platform/tenants/{{ _.platform_tenant_id }}/api_keys/{{ _.platform_api_key_id }}"
        name: Show API key
        meta:
          id: req_6d29dbc1171726e8109a92974bfa3d5d
          created: 1791374400000
          modified: 1791374400000
          isPrivate: false
          sortKey: 5
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/platform/tenants/{{ _.platform_tenant_id }}/api_keys"
        name: Issue API key
        meta:
          id: req_f79943b52d6d5b7f93007deace84c63d
          created: 1791374400000
          modified: 1791374400000
          isPrivate: false
          sortKey: 6
        method: POST
        body:
          mimeType: application/x-www-form-urlencoded
          params:
            - name: authenticity_token
              value: "{{ _.platform_authenticity_token }}"
            - name: api_key[name]
              value: "{% prompt 'Key name', '', '', '', false, false %}"
        headers:
          - name: Content-Type
            value: application/x-www-form-urlencoded
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/platform/tenants/{{ _.platform_tenant_id }}/api_keys/{{ _.platform_api_key_id }}/revoke"
        name: Revoke API key
        meta:
          id: req_f2c4631bce8984882813683de04dad6e
          created: 1791374400000
          modified: 1791374400000
          isPrivate: false
          sortKey: 7
        method: POST
        body:
          mimeType: application/x-www-form-urlencoded
          params:
            - name: authenticity_token
              value: "{{ _.platform_authenticity_token }}"
        headers:
          - name: Content-Type
            value: application/x-www-form-urlencoded
        settings:
          renderRequestBody: true
