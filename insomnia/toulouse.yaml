          created: 1791319630754
          modified: 1791319630754
          isPrivate: false
          sortKey: 0
        method: GET
        scripts:
          afterResponse: |-
            const token = insomnia.response.text().match(/name="authenticity_token" value="([^"]+)"/)?.[1];
            insomnia.environment.set("platform_authenticity_token", token ?? "");
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/platform/session"
