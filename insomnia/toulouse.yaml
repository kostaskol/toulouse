    meta:
      id: fld_5b67cc497bee939d102857d59b70eabe
      created: 1791398000000
      modified: 1791398000000
      sortKey: 3
      description: >-
        Called by a storefront's BFF. Every request sends the tenant API key,
        from Show API key in platform admin. Current session and Log out send
        the token that Log in returns. Complete signup and Complete password
        reset take the code from the mail under tmp/mails. The requests that
        mail a code send the shopper's IP in X-Shopper-Ip, as a BFF must.
    children:
      - url: "{{ _.base_url }}/v1/storefront/session"
        name: Log in
        meta:
          id: req_88be0382da29cfe4996a412f823b27f6
          created: 1791398000000
          modified: 1791398000000
          isPrivate: false
          sortKey: 0
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "email": "{{ _.shopper_email }}",
              "password": "{{ _.password }}"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: X-Api-Key
            value: "{{ _.api_key }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
